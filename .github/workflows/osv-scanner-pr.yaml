name: OSV-Scanner PR Scan

# This repository's default branch is master, not the template's main.
on:
  pull_request:
  merge_group:
    branches: [master]
  push:
    branches:
      - master

permissions:
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Only need to read contents and actions
  contents: read
  actions: read

jobs:
  scan-pr:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0"
