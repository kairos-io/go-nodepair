name: OSV-Scanner PR Scan

# This repository's default branch is master, not the template's main.
on:
  pull_request:
  merge_group:
    branches: [master]
  push:
    branches:
      - master
  schedule:
    - cron: "12 12 * * 1"

permissions:
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Only need to read contents and actions
  contents: read
  actions: read

jobs:
  # A pull request is scanned against its own base, so the check only goes red
  # for an advisory the pull request itself introduces. An advisory published
  # against code already on master is in both scans and cancels out.
  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0"

  # master, the merge queue and the weekly run carry the whole baseline, so an
  # advisory published against merged code surfaces here rather than on the
  # next unrelated pull request. The diff scan cannot serve the merge queue:
  # it reads GITHUB_BASE_REF, which GitHub sets for pull_request only.
  scan-baseline:
    if: ${{ github.event_name != 'pull_request' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0"
